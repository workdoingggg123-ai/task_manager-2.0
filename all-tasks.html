<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>All Tasks</title>
    <link rel="icon" type="image/png"
      href="https://cdn-icons-png.flaticon.com/128/6177/6177329.png">

    <link rel="stylesheet" href="all-tasks.css">
</head>

<style>
      /* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =========================================================
   BODY
========================================================= */

body {
    min-height: 100vh;

    font-family: Arial, sans-serif;

    background: #f5f7fb;

    color: #1f2937;

    padding: 30px;
}


/* =========================================================
   MAIN
========================================================= */

main {
    width: 100%;
}


/* =========================================================
   TOP
========================================================= */

.top {
    width: min(1200px, 94%);

    margin: 0 auto 25px;

    display: flex;

    align-items: center;

    justify-content: space-between;
}

.top h1 {
    color: #1f2937;

    font-size: 30px;

    font-weight: 700;
}


/* =========================================================
   BACK BUTTON
========================================================= */

.back-btn {
    display: flex;

    align-items: center;

    justify-content: center;

    gap: 8px;

    padding: 10px 18px;

    border: 1px solid #e5e7eb;

    border-radius: 8px;

    background: #ffffff;

    color: #374151;

    font-size: 14px;

    font-weight: 600;

    cursor: pointer;

    transition:
        background 0.2s,
        transform 0.2s,
        box-shadow 0.2s;
}

.back-btn:hover {
    background: #f8fafc;

    transform: translateY(-1px);

    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
}

.back-btn:active {
    transform: scale(0.97);
}


/* =========================================================
   STATUS CARD SECTION
========================================================= */

.card {
    width: min(1200px, 94%);

    margin: 0 auto 25px;

    display: grid;

    grid-template-columns: repeat(4, 1fr);

    gap: 20px;
}


/* =========================================================
   TASK STATUS CARD
========================================================= */

.task-status {
    position: relative;

    width: 100%;

    min-height: 130px;

    padding: 20px;

    overflow: hidden;

    background: #ffffff;

    border: 1px solid #edf0f3;

    border-radius: 12px;

    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.04);

    transition:
        transform 0.2s,
        box-shadow 0.2s;
}

.task-status:hover {
    transform: translateY(-3px);

    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.07);
}


/* =========================================================
   STATUS CARD CONTENT
========================================================= */

.task-bars {
    position: relative;

    z-index: 2;

    display: flex;

    align-items: center;

    gap: 15px;
}


/* =========================================================
   STATUS ICON
========================================================= */

.task-bars img {
    width: 48px;

    height: 48px;

    padding: 12px;

    flex-shrink: 0;

    background: #eaf3ff;

    border-radius: 50%;

    object-fit: contain;
}


/* =========================================================
   STATUS TEXT
========================================================= */

.total-task {
    min-width: 0;
}

.total-task h3 {
    margin-bottom: 6px;

    color: #6b7280;

    font-size: 12px;

    font-weight: 600;

    text-transform: uppercase;

    letter-spacing: 0.5px;
}

.total-task h2 {
    margin-bottom: 5px;

    color: #111827;

    font-size: 30px;

    font-weight: 700;

    line-height: 1;
}

.total-task p {
    color: #9ca3af;

    font-size: 11px;

    line-height: 1.4;
}


/* =========================================================
   TASK DISPLAY
========================================================= */

.display-task {
    width: min(1200px, 94%);

    margin: auto;

    background: #ffffff;

    border: 1px solid #edf0f3;

    border-radius: 12px;

    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.04);

    overflow: hidden;
}


/* =========================================================
   TABLE HEADER
========================================================= */

.header {
    display: grid;

    grid-template-columns:
        1.2fr
        1.5fr
        1fr
        1.5fr
        100px;

    align-items: center;

    gap: 20px;

    min-height: 55px;

    padding: 0 10px;

    background: #f8fafc;

    border-bottom: 1px solid #edf0f3;
}

.header h4 {
    color: #6b7280;

    font-size: 12px;

    font-weight: 600;

    text-transform: uppercase;

    letter-spacing: 0.5px;
}


/* =========================================================
   TASK CONTAINER
========================================================= */

.tasks {
    width: 100%;
}


/* =========================================================
   TASK ROW
   SAME STRUCTURE AS HOME PAGE .all-tasks
========================================================= */

.task {
    display: grid;

    grid-template-columns:
        1.2fr
        1.5fr
        1fr
        1.5fr
        100px;

    align-items: center;

    gap: 20px;

    padding: 16px 10px;

    border-bottom: 1px solid #edf0f3;

    background: #ffffff;

    font-size: 15px;

    transition:
        background 0.2s,
        transform 0.2s,
        opacity 0.2s;
}

.task:last-child {
    border-bottom: none;
}

.task:hover {
    background: #f8fafc;
}


/* =========================================================
   USER NAME
========================================================= */

.user-name {
    color: #1f2937;

    font-size: 15px;

    font-weight: 600;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}


/* =========================================================
   TASK NAME
========================================================= */

.task-name {
    color: #374151;

    font-size: 14px;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}


/* =========================================================
   PRIORITY
========================================================= */

.user_choice {
    width: fit-content;

    padding: 5px 10px;

    border-radius: 6px;

    color: #4f46e5;

    background: #eef2ff;

    border: 1px solid #e0e7ff;

    font-size: 12px;

    font-weight: 600;
}


/* =========================================================
   TIME
========================================================= */

.task-time {
    color: #6b7280;

    font-size: 13px;

    line-height: 1.5;
}


/* =========================================================
   ACTION
========================================================= */

.user_action {
    display: flex;

    align-items: center;

    gap: 8px;

    color: #6b7280;

    font-size: 13px;

    font-weight: 600;
}


/* =========================================================
   WAITING ICON
========================================================= */

.img_que {
    width: 28px;

    height: 28px;

    padding: 0;

    margin: 0;

    background: transparent;

    border-radius: 0;

    object-fit: contain;

    display: block;

    filter:
        invert(20%)
        sepia(90%)
        saturate(5000%)
        hue-rotate(350deg)
        brightness(90%)
        contrast(100%);

    animation: waiting 1.8s ease-in-out infinite;

    transition: transform 0.25s ease;
}


@keyframes waiting {

    0% {
        transform: rotate(0deg);
        opacity: 0.6;
    }

    50% {
        transform: rotate(8deg);
        opacity: 1;
    }

    100% {
        transform: rotate(0deg);
        opacity: 0.6;
    }
}


/* =========================================================
   COMPLETED ICON
========================================================= */

.complete-task {
    width: 30px;

    height: 30px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    cursor: pointer;

    transition:
        transform 0.2s,
        filter 0.2s;
}

.complete-task:hover {
    transform: scale(1.12);

    filter: drop-shadow(
        0 0 8px rgba(34, 197, 94, 0.5)
    );
}

.complete-task svg {
    width: 27px;

    height: 27px;

    display: block;
}


/* =========================================================
   COMPLETED TASK
   SAME AS HOME PAGE
========================================================= */

.task.completed {
    opacity: 0.55;

    background: #f9fafb;
}

.task.completed .task-name,
.task.completed .user-name {
    text-decoration: line-through;

    color: #9ca3af;
}


/* =========================================================
   EMPTY STATE
========================================================= */

.empty {
    min-height: 260px;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    color: #9ca3af;

    font-size: 15px;
}

.empty::before {
    content: "✓";

    width: 55px;

    height: 55px;

    margin-bottom: 15px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    color: #6366f1;

    background: #eef2ff;

    border: 1px solid #e0e7ff;

    font-size: 22px;
}


/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar {
    width: 7px;

    height: 7px;
}

::-webkit-scrollbar-track {
    background: transparent;
}

::-webkit-scrollbar-thumb {
    border-radius: 10px;

    background: #cbd5e1;
}

::-webkit-scrollbar-thumb:hover {
    background: #94a3b8;
}


/* =========================================================
   DARK MODE
   Add class "dark-mode" to body using JavaScript
========================================================= */

body.dark-mode {
    background: #0f172a;

    color: #f5f7fb;
}


/* =========================================================
   DARK MODE - TOP
========================================================= */

body.dark-mode .top h1 {
    color: #f5f7fb;
}


/* =========================================================
   DARK MODE - BACK BUTTON
========================================================= */

body.dark-mode .back-btn {
    background: #111827;

    color: #e5e7eb;

    border-color: #273244;
}

body.dark-mode .back-btn:hover {
    background: #1f2937;

    border-color: #374151;
}


/* =========================================================
   DARK MODE - STATUS CARD
========================================================= */

body.dark-mode .task-status {
    background: #111827;

    border-color: #273244;

    box-shadow:
        0 3px 15px rgba(0, 0, 0, 0.25);
}

body.dark-mode .task-status:hover {
    box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.35);
}


/* =========================================================
   DARK MODE - STATUS ICON
========================================================= */

body.dark-mode .task-bars img {
    background: #1e293b;
}


/* =========================================================
   DARK MODE - STATUS TEXT
========================================================= */

body.dark-mode .total-task h3 {
    color: #94a3b8;
}

body.dark-mode .total-task h2 {
    color: #f8fafc;
}

body.dark-mode .total-task p {
    color: #64748b;
}


/* =========================================================
   DARK MODE - TASK DISPLAY
========================================================= */

body.dark-mode .display-task {
    background: #111827;

    border-color: #273244;

    box-shadow:
        0 3px 15px rgba(0, 0, 0, 0.25);
}


/* =========================================================
   DARK MODE - HEADER
========================================================= */

body.dark-mode .header {
    background: #172033;

    border-bottom-color: #273244;
}

body.dark-mode .header h4 {
    color: #94a3b8;
}


/* =========================================================
   DARK MODE - TASK ROW
========================================================= */

body.dark-mode .task {
    background: #111827;

    border-bottom-color: #273244;
}

body.dark-mode .task:hover {
    background: #172033;
}


/* =========================================================
   DARK MODE - USER NAME
========================================================= */

body.dark-mode .user-name {
    color: #f1f5f9;
}


/* =========================================================
   DARK MODE - TASK NAME
========================================================= */

body.dark-mode .task-name {
    color: #cbd5e1;
}


/* =========================================================
   DARK MODE - PRIORITY
========================================================= */

body.dark-mode .user_choice {
    color: #c4b5fd;

    background: rgba(139, 92, 246, 0.14);

    border-color: rgba(139, 92, 246, 0.25);
}


/* =========================================================
   DARK MODE - TIME
========================================================= */

body.dark-mode .task-time {
    color: #94a3b8;
}


/* =========================================================
   DARK MODE - ACTION
========================================================= */

body.dark-mode .user_action {
    color: #94a3b8;
}


/* =========================================================
   DARK MODE - COMPLETED TASK
========================================================= */

body.dark-mode .task.completed {
    background: #0f172a;

    opacity: 0.55;
}

body.dark-mode .task.completed .task-name,
body.dark-mode .task.completed .user-name {
    color: #64748b;
}


/* =========================================================
   DARK MODE - EMPTY
========================================================= */

body.dark-mode .empty {
    color: #64748b;
}

body.dark-mode .empty::before {
    color: #a5b4fc;

    background: rgba(99, 102, 241, 0.12);

    border-color: rgba(99, 102, 241, 0.25);
}


/* =========================================================
   DARK MODE - SCROLLBAR
========================================================= */

body.dark-mode ::-webkit-scrollbar-thumb {
    background: #334155;
}

body.dark-mode ::-webkit-scrollbar-thumb:hover {
    background: #475569;
}


/* =========================================================
   RESPONSIVE - STATUS CARDS
========================================================= */

@media (max-width: 1000px) {

    .card {
        grid-template-columns: repeat(2, 1fr);
    }
}


/* =========================================================
   RESPONSIVE - TABLE
========================================================= */

@media (max-width: 850px) {

    body {
        padding: 25px 15px;
    }

    .top {
        width: 100%;
    }

    .top h1 {
        font-size: 27px;
    }

    .display-task {
        width: 100%;

        overflow-x: auto;
    }

    .header,
    .task {
        min-width: 850px;
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .card {
        grid-template-columns: 1fr;
    }

    .task-status {
        min-height: 140px;
    }

    .top h1 {
        font-size: 25px;
    }

    .back-btn {
        padding: 9px 14px;
    }
}


/* =========================================================
   VERY SMALL SCREEN
========================================================= */

@media (max-width: 400px) {

    body {
        padding: 20px 10px;
    }

    .top h1 {
        font-size: 22px;
    }

    .back-btn {
        padding: 8px 12px;

        font-size: 13px;
    }
}
</style>

<body>

    <main>

        <div class="top">
            <h1>All Tasks</h1>

            <button class="back-btn">
                ← Back
            </button>
        </div>
<section class="card">
        <div class="task-status">
            <div class="task-bars">
                <img src="https://www.svgrepo.com/show/502401/task.svg" alt="img">
                <div class="total-task">
                    <h3>Total task</h3>
                    <h2 id = "total_h2">0</h2>
                    <p>Qll assign tasks</p>
                </div>
            </div>
        </section>


        <section class="display-task">

            <div class="header">
                <h4>Name</h4>
                <h4>Task Name</h4>
                <h4>Priority</h4>
                <h4>Time</h4>
                <h4>Action</h4>
            </div>


            <div class="empty">
                No tasks yet.
            </div>


            <div class="tasks" id="taskContainer"></div>

        </section>

    </main>


    <script src="all-tasks.js"></script>

</body>
</html>
