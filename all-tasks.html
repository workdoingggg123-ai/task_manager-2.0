<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>All Tasks</title>

    <link rel="stylesheet" href="all-tasks.css">
</head>

<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #080b12;
    --card: #111620;
    --card-light: #171d29;
    --border: rgba(255, 255, 255, 0.08);

    --text: #f5f7fb;
    --muted: #8d96a8;

    --blue: #6366f1;
    --purple: #8b5cf6;
    --green: #22c55e;
    --red: #ef4444;

    --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
}

body {
    min-height: 100vh;

    font-family: Arial, sans-serif;

    color: var(--text);

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(99, 102, 241, 0.15),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 90%,
            rgba(139, 92, 246, 0.12),
            transparent 30%
        ),
        var(--bg);

    padding: 50px 30px;
}


/* =================================
   MAIN
================================= */

main {
    width: 100%;
}


/* =================================
   TOP
================================= */

.top {
    width: min(1200px, 94%);

    margin: 0 auto 35px;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.top h1 {
    position: relative;

    font-size: 34px;
    font-weight: 700;

    letter-spacing: -1px;
}

.top h1::after {
    content: "";

    display: block;

    width: 45px;
    height: 4px;

    margin-top: 8px;

    border-radius: 10px;

    background: linear-gradient(
        90deg,
        var(--blue),
        var(--purple)
    );
}


/* =================================
   BACK BUTTON
================================= */

.back-btn {
    display: flex;
    align-items: center;
    gap: 8px;

    padding: 12px 20px;

    border: 1px solid var(--border);
    border-radius: 12px;

    color: white;

    background: rgba(255, 255, 255, 0.05);

    font-size: 14px;
    font-weight: 600;

    cursor: pointer;

    backdrop-filter: blur(10px);

    transition:
        transform 0.25s ease,
        background 0.25s ease,
        border 0.25s ease;
}

.back-btn:hover {
    transform: translateY(-2px);

    background: linear-gradient(
        135deg,
        var(--blue),
        var(--purple)
    );

    border-color: transparent;

    box-shadow:
        0 10px 30px rgba(99, 102, 241, 0.3);
}

.back-btn:active {
    transform: scale(0.96);
}


/* =================================
   TASK SECTION
================================= */

.display-task {
    width: min(1200px, 94%);

    margin: auto;

    padding: 10px;

    border: 1px solid var(--border);
    border-radius: 20px;

    background: rgba(17, 22, 32, 0.82);

    box-shadow: var(--shadow);

    backdrop-filter: blur(18px);

    overflow: hidden;
}


/* =================================
   HEADER
================================= */

.header {
    display: grid;

    grid-template-columns:
        1.2fr
        1.7fr
        1fr
        1.6fr
        1fr;

    align-items: center;

    min-height: 65px;

    padding: 0 25px;

    border-bottom: 1px solid var(--border);

    background: rgba(255, 255, 255, 0.025);
}

.header h4 {
    color: var(--muted);

    font-size: 12px;
    font-weight: 600;

    text-transform: uppercase;

    letter-spacing: 1px;
}


/* =================================
   TASK CONTAINER
================================= */

.tasks {
    width: 100%;
}


.card {
    width: min(1200px, 94%);

    margin: 0 auto 30px;

    display: grid;
    grid-template-columns: repeat(4, 1fr);

    gap: 20px;
}


/* =================================
   TASK STATUS CARD
================================= */

.task-status {
    position: relative;

    width: 100%;
    min-height: 155px;

    padding: 24px;

    overflow: hidden;

    border: 1px solid rgba(255, 255, 255, 0.08);

    border-radius: 20px;

    background:
        linear-gradient(
            145deg,
            rgba(25, 31, 45, 0.95),
            rgba(13, 17, 25, 0.98)
        );

    box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);

    backdrop-filter: blur(15px);

    transition:
        transform 0.3s ease,
        border-color 0.3s ease,
        box-shadow 0.3s ease;
}


/* Decorative glow */

.task-status::before {
    content: "";

    position: absolute;

    width: 120px;
    height: 120px;

    right: -45px;
    top: -50px;

    border-radius: 50%;

    background: rgba(99, 102, 241, 0.18);

    filter: blur(25px);

    pointer-events: none;
}


/* Bottom accent */

.task-status::after {
    content: "";

    position: absolute;

    left: 24px;
    bottom: 0;

    width: 45px;
    height: 3px;

    border-radius: 10px 10px 0 0;

    background: linear-gradient(
        90deg,
        #6366f1,
        #8b5cf6
    );
}


/* =================================
   HOVER
================================= */

.task-status:hover {
    transform: translateY(-6px);

    border-color: rgba(99, 102, 241, 0.35);

    box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.38),
        0 0 30px rgba(99, 102, 241, 0.08);
}


/* =================================
   ICON + CONTENT
================================= */

.task-bars {
    position: relative;
    z-index: 2;

    display: flex;

    align-items: center;

    gap: 18px;
}


/* =================================
   ICON
================================= */

.task-bars img {
    width: 52px;
    height: 52px;

    padding: 12px;

    flex-shrink: 0;

    border-radius: 15px;

    background: rgba(99, 102, 241, 0.12);

    border: 1px solid rgba(99, 102, 241, 0.15);

    filter:
        brightness(0)
        saturate(100%)
        invert(43%)
        sepia(90%)
        saturate(2500%)
        hue-rotate(220deg)
        brightness(100%)
        contrast(100%);

    transition:
        transform 0.3s ease,
        background 0.3s ease;
}


.task-status:hover .task-bars img {
    transform: scale(1.08) rotate(-4deg);

    background: rgba(99, 102, 241, 0.18);
}


/* =================================
   TEXT
================================= */

.total-task {
    min-width: 0;
}


.total-task h3 {
    margin-bottom: 7px;

    color: #8993a6;

    font-size: 12px;
    font-weight: 600;

    text-transform: uppercase;

    letter-spacing: 1px;
}


.total-task h2 {
    margin-bottom: 6px;

    color: #f5f7fb;

    font-size: 32px;
    font-weight: 700;

    line-height: 1;
}


.total-task p {
    color: #687286;

    font-size: 11px;

    line-height: 1.4;
}


/* =================================
   RESPONSIVE
================================= */

@media (max-width: 1000px) {

    .card {
        grid-template-columns: repeat(2, 1fr);
    }
}


@media (max-width: 600px) {

    .card {
        grid-template-columns: 1fr;
    }

    .task-status {
        min-height: 140px;
    }
}

/* =================================
   TASK ROW
================================= */

.task {
    position: relative;

    display: grid;

    grid-template-columns:
        1.2fr
        1.7fr
        1fr
        1.6fr
        1fr;

    align-items: center;

    min-height: 78px;

    padding: 0 25px;

    border-bottom: 1px solid var(--border);

    transition:
        background 0.25s ease,
        transform 0.25s ease;
}

.task:last-child {
    border-bottom: none;
}


/* Left glowing line */

.task::before {
    content: "";

    position: absolute;

    left: 0;
    top: 20%;

    width: 3px;
    height: 60%;

    border-radius: 0 5px 5px 0;

    background: linear-gradient(
        180deg,
        var(--blue),
        var(--purple)
    );

    opacity: 0;

    transition: opacity 0.25s ease;
}


.task:hover {
    background: rgba(255, 255, 255, 0.035);
}

.task:hover::before {
    opacity: 1;
}


/* =================================
   USER NAME
================================= */

.user-name {
    color: var(--text);

    font-size: 15px;
    font-weight: 600;

    overflow: hidden;

    text-overflow: ellipsis;
    white-space: nowrap;
}


/* =================================
   TASK NAME
================================= */

.task-name {
    color: #d8dce5;

    font-size: 14px;

    overflow: hidden;

    text-overflow: ellipsis;
    white-space: nowrap;
}


/* =================================
   PRIORITY
================================= */

.user_choice {
    width: fit-content;

    padding: 6px 12px;

    border-radius: 20px;

    color: #c4b5fd;

    background: rgba(139, 92, 246, 0.12);

    border: 1px solid rgba(139, 92, 246, 0.2);

    font-size: 12px;
    font-weight: 600;
}


/* =================================
   TIME
================================= */

.task-time {
    color: var(--muted);

    font-size: 13px;

    line-height: 1.5;
}


/* =================================
   ACTION
================================= */

.user_action {
    display: flex;
    align-items: center;
    gap: 12px;
    
}

.img_que {
    
    width: 28px;
    height: 28px;

    object-fit: contain;

    display: block;

    /* Make the SVG red */
    filter: invert(20%) sepia(90%) saturate(5000%) hue-rotate(350deg)
            brightness(90%) contrast(100%);
 animation: waiting 1.8s ease-in-out infinite;

    transition: transform 0.25s ease;
}



@keyframes waiting {
    0% {
        transform: rotate(0deg);
        opacity: 0.6;
    }

    50% {
        transform: rotate(8deg);
        opacity: 1;
    }

    100% {
        transform: rotate(0deg);
        opacity: 0.6;
    }
}



@keyframes completed {
    0% {
        transform: rotate(0deg);
        opacity: 0.6;
    }

    50% {
        transform: rotate(8deg);
        opacity: 1;
    }

    100% {
        transform: rotate(0deg);
        opacity: 0.6;
    }
}


/* =================================
   COMPLETE
================================= */

.complete-task {
    width: 30px;
    height: 30px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    cursor: pointer;

    transition:
        transform 0.2s ease,
        filter 0.2s ease;
    animation: completed.8s ease-in-out infinite;
}

.complete-task:hover {
    transform: scale(1.12);

    filter: drop-shadow(
        0 0 8px rgba(34, 197, 94, 0.5)
    );
}

.complete-task svg {
    width: 27px;
    height: 27px;

    display: block;
}


/* =================================
   DELETE
================================= */

.in-svg {
    width: 36px;
    height: 36px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 9px;

    cursor: pointer;

    transition:
        background 0.2s ease,
        transform 0.2s ease;
}

.in-svg:hover {
    background: rgba(239, 68, 68, 0.1);

    transform: translateY(-2px);
}

.delete-icon {
    width: 23px;
    height: 23px;

    fill: none;

    stroke: #737c8f;

    stroke-width: 1.8;

    stroke-linecap: round;
    stroke-linejoin: round;

    transition: stroke 0.2s ease;
}

.in-svg:hover .delete-icon {
    stroke: var(--red);
}


/* =================================
   COMPLETED TASK
================================= */

.task.completed {
    opacity: 0.55;
}

.task.completed .task-name {
    color: var(--muted);

    text-decoration: line-through;
}

.task.completed .user-name {
    color: var(--muted);
}


/* =================================
   EMPTY STATE
================================= */

.empty {
    min-height: 260px;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    color: var(--muted);

    font-size: 15px;
}

.empty::before {
    content: "✓";

    width: 55px;
    height: 55px;

    margin-bottom: 15px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    color: #a5b4fc;

    background: rgba(99, 102, 241, 0.1);

    border: 1px solid rgba(99, 102, 241, 0.2);

    font-size: 22px;
}


/* =================================
   SCROLLBAR
================================= */

::-webkit-scrollbar {
    width: 7px;
    height: 7px;
}

::-webkit-scrollbar-track {
    background: transparent;
}

::-webkit-scrollbar-thumb {
    border-radius: 10px;

    background: #2a3140;
}

::-webkit-scrollbar-thumb:hover {
    background: #3b4558;
}


/* =================================
   MOBILE
================================= */

@media (max-width: 850px) {

    body {
        padding: 30px 15px;
    }

    .top {
        width: 100%;
    }

    .top h1 {
        font-size: 27px;
    }

    .display-task {
        width: 100%;

        overflow-x: auto;
    }

    .header,
    .task {
        min-width: 850px;
    }
}
</style>

<body>

    <main>

        <div class="top">
            <h1>All Tasks</h1>

            <button class="back-btn">
                ← Back
            </button>
        </div>
<section class="card">
        <div class="task-status">
            <div class="task-bars">
                <img src="https://www.svgrepo.com/show/502401/task.svg" alt="img">
                <div class="total-task">
                    <h3>Total task</h3>
                    <h2 id = "total_h2">0</h2>
                    <p>Qll assign tasks</p>
                </div>
            </div>
        </section>


        <section class="display-task">

            <div class="header">
                <h4>Name</h4>
                <h4>Task Name</h4>
                <h4>Priority</h4>
                <h4>Time</h4>
                <h4>Action</h4>
            </div>


            <div class="empty">
                No tasks yet.
            </div>


            <div class="tasks" id="taskContainer"></div>

        </section>

    </main>


    <script src="all-tasks.js"></script>

</body>
</html>
