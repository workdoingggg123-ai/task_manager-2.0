<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Task Board - Login</title>

    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        /* =========================
           BODY
        ========================= */

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #f7f8fc;
            color: #111827;

            padding: 20px;

            transition: 0.3s ease;
        }


        /* =========================
           MAIN LOGIN CONTAINER
        ========================= */

        .login-container {
            width: 100%;
            max-width: 430px;

            background: white;

            padding: 40px;

            border-radius: 20px;

            border: 1px solid #e5e7eb;

            box-shadow:
                0 20px 50px rgba(30, 41, 59, 0.10);
        }


        /* =========================
           LOGO
        ========================= */

        .logo {
            width: 55px;
            height: 55px;

            margin: 0 auto 20px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #633de0,
                #5230cd
            );

            color: white;

            border-radius: 15px;

            font-size: 24px;
            font-weight: bold;

            box-shadow:
                0 8px 20px rgba(99, 61, 224, 0.25);
        }


     /* =========================
         invalid
        ========================= */
  .invalid-info{
    color: rgba(255, 0, 0, 0.701);
    margin: 20px 0px ;
    display: none;
  }

  .invalid-info.show{
    display: block;
  }

        /* =========================
           HEADING
        ========================= */

        .login-header {
            text-align: center;

            margin-bottom: 30px;
        }

        .login-header h1 {
            font-size: 28px;

            margin-bottom: 8px;

            color: #111827;
        }

        .login-header p {
            font-size: 14px;

            color: #64748b;
        }


        /* =========================
           FORM
        ========================= */

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            font-size: 14px;

            font-weight: 600;

            color: #374151;
        }


        /* =========================
           INPUT
        ========================= */

        .input-box {
            position: relative;
        }

        .input-box input {
            width: 100%;

            padding: 14px 15px;

            border: 1px solid #d1d5db;

            border-radius: 10px;

            outline: none;

            background: #f9fafb;

            color: #111827;

            font-size: 14px;

            transition: 0.2s;
        }

        .input-box input:hover {
            border-color: #9ca3af;
        }

        .input-box input:focus {
            background: white;

            border-color: #633de0;

            box-shadow:
                0 0 0 3px rgba(99, 61, 224, 0.12);
        }


        /* =========================
           PASSWORD
        ========================= */

        .password-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 7px;
        }

        .password-header label {
            margin: 0;
        }

        .forgot-password {
            border: none;

            background: none;

            padding: 0;

            color: #633de0;

            font-size: 12px;

            cursor: pointer;

            box-shadow: none;
        }

        .forgot-password:hover {
            transform: none;

            box-shadow: none;

            text-decoration: underline;
        }


        /* =========================
           LOGIN BUTTON
        ========================= */

        .login-btn {
            width: 100%;

            padding: 14px;

            margin-top: 5px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #633de0,
                    #5230cd
                );

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;

            box-shadow:
                0 6px 15px rgba(99, 61, 224, 0.25);
        }

        .login-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 10px 20px rgba(99, 61, 224, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }


        /* =========================
           DIVIDER
        ========================= */

        .divider {
            display: flex;

            align-items: center;

            gap: 12px;

            margin: 25px 0;
        }

        .divider span {
            height: 1px;

            flex: 1;

            background: #e5e7eb;
        }

        .divider p {
            font-size: 12px;

            color: #94a3b8;
        }


        /* =========================
           GOOGLE BUTTON
        ========================= */

        .google-btn {
            width: 100%;

            padding: 13px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 12px;

            border: 1px solid #d1d5db;

            border-radius: 10px;

            background: white;

            color: #374151;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;

            box-shadow: none;
        }

        .google-btn:hover {
            background: #f9fafb;

            border-color: #9ca3af;

            transform: translateY(-1px);

            box-shadow:
                0 5px 12px rgba(30, 41, 59, 0.08);
        }

        .google-btn img {
            width: 20px;
            height: 20px;

            padding: 0;

            background: none;

            border-radius: 0;

            object-fit: contain;
        }


        /* =========================
           SIGN UP
        ========================= */

        .signup {
            text-align: center;

            margin-top: 25px;

            font-size: 13px;

            color: #64748b;
        }

        .signup a {
            color: #633de0;

            font-weight: 600;

            text-decoration: none;
        }

        .signup a:hover {
            text-decoration: underline;
        }


        /* =========================
           DARK MODE BUTTON
        ========================= */

        .theme-btn {
            position: fixed;

            top: 20px;
            right: 20px;

            width: 42px;
            height: 42px;

            padding: 10px;

            border: 1px solid #e5e7eb;

            border-radius: 50%;

            background: white;

            cursor: pointer;

            box-shadow:
                0 5px 15px rgba(30, 41, 59, 0.08);
        }

        .theme-btn:hover {
            transform: scale(1.05);

            box-shadow:
                0 8px 20px rgba(30, 41, 59, 0.12);
        }

        .theme-btn img {
            width: 100%;
            height: 100%;

            padding: 0;

            background: none;

            border-radius: 0;
        }


        /* =========================
           DARK MODE
        ========================= */

        body.dark-mode {
            background: #0f1115;

            color: #f1f5f9;
        }

        body.dark-mode .login-container {
            background: #181c23;

            border-color: #2a303a;

            box-shadow: none;
        }

        body.dark-mode .login-header h1 {
            color: #f1f5f9;
        }

        body.dark-mode .login-header p {
            color: #94a3b8;
        }

        body.dark-mode .form-group label {
            color: #cbd5e1;
        }

        body.dark-mode .input-box input {
            background: #11151b;

            color: #f1f5f9;

            border-color: #343b46;
        }

        body.dark-mode .input-box input:focus {
            background: #151a21;

            border-color: #633de0;
        }

        body.dark-mode .divider span {
            background: #2a303a;
        }

        body.dark-mode .google-btn {
            background: #11151b;

            color: #f1f5f9;

            border-color: #343b46;
        }

        body.dark-mode .google-btn:hover {
            background: #151a21;
        }

        body.dark-mode .theme-btn {
            background: #181c23;

            border-color: #343b46;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            body {
                padding: 15px;
            }

            .login-container {
                padding: 30px 22px;

                border-radius: 16px;
            }

            .login-header h1 {
                font-size: 24px;
            }

            .logo {
                width: 50px;
                height: 50px;

                font-size: 21px;
            }

            .theme-btn {
                top: 12px;
                right: 12px;

                width: 38px;
                height: 38px;
            }
        }


        /* =========================
           VERY SMALL PHONE
        ========================= */

        @media (max-width: 350px) {

            .login-container {
                padding: 25px 18px;
            }

            .login-header h1 {
                font-size: 21px;
            }

            .login-header p {
                font-size: 12px;
            }
        }

    </style>
</head>

<body>

    <!-- DARK MODE -->
    <button class="theme-btn" id="themeBtn">
        <img
            id="themeIcon"
            src="https://www.svgrepo.com/show/532875/moon.svg"
            alt="theme"
        >
    </button>


    <!-- LOGIN -->
    <div class="login-container">

        <div class="logo">
            ST
        </div>


        <div class="login-header">

            <h1>Welcome Back</h1>

            <p>
                Login to continue to your Student Task Board
            </p>

        </div>
       <div class="invalid-info">
        Invalid credentials
       </div>

        <form id="loginForm">

            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <div class="input-box">

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <div class="password-header">

                    <label for="password">
                        Password
                    </label>

                    <button
                        type="button"
                        class="forgot-password"
                    >
                        Forgot password?
                    </button>

                </div>

                <div class="input-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>

            </div>


            <!-- LOGIN -->

            <button
                type="submit"
                class="login-btn"
            >
                Login
            </button>

        </form>


        <!-- DIVIDER -->

        <div class="divider">

            <span></span>

            <p>OR</p>

            <span></span>

        </div>


        <!-- GOOGLE -->

        <button
            class="google-btn"
            id="googleBtn"
            type="button"
        >

            <img
                src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                alt="Google"
            >

            Continue with Google

        </button>


        <!-- SIGN UP -->

        <div class="signup">

            Don't have an account?

            <a href="signup.html">
                Sign up
            </a>

        </div>

    </div>


    <script>

        /* =========================
           ELEMENTS
        ========================= */

        let loginForm = document.querySelector("#loginForm");

        let googleBtn = document.querySelector("#googleBtn");

        let themeBtn = document.querySelector("#themeBtn");

        let themeIcon = document.querySelector("#themeIcon");

        let email = document.querySelector("#email");
        let password = document.querySelector("#password");
        let invalid_login = document.querySelector(".invalid-info");


        /* =========================
           NORMAL LOGIN
        ========================= */

        loginForm.addEventListener("submit", function(e) {

            e.preventDefault();

           


            if (
                email.value.trim() === "" ||
                password.value.trim() === ""
            ) {

                alert("Please fill all fields");

                return;

            }


            /*
                TEMPORARY LOGIN

                Later you can connect this
                to Firebase/backend authentication.
            */

            localStorage.setItem(
                "loggedIn",
                "true"
            );
            console.log(email.value);
            console.log(password.value);
            
            

            let last_logged_email = localStorage.getItem("email");
            let last_logged_password = localStorage.getItem("password");


            if(last_logged_email != email.value || last_logged_password != password.value){
                invalid_login.classList.add("show")
            }


           else{
               window.location.href =
                "main.html";
           }



        });


        /* =========================
           GOOGLE LOGIN
        ========================= */

        googleBtn.addEventListener("click", function() {

            /*
                This is only the button UI.

                Real Google authentication
                needs Google OAuth / Firebase.
            */

            alert(
                "Google Login will be connected using Google OAuth."
            );

        });


        /* =========================
           DARK MODE
        ========================= */

        themeBtn.addEventListener("click", function() {

            document.body.classList.toggle("dark-mode");


            if (
                document.body.classList.contains("dark-mode")
            ) {

                localStorage.setItem(
                    "loginDark",
                    "true"
                );

                themeIcon.setAttribute(
                    "src",
                    "https://www.svgrepo.com/show/532889/sun.svg"
                );

            } else {

                localStorage.setItem(
                    "loginDark",
                    "false"
                );

                themeIcon.setAttribute(
                    "src",
                    "https://www.svgrepo.com/show/532875/moon.svg"
                );

            }

        });


        /* =========================
           LOAD DARK MODE
        ========================= */

        let savedTheme =
            localStorage.getItem("loginDark");


        if (savedTheme === "true") {

            document.body.classList.add("dark-mode");

            themeIcon.setAttribute(
                "src",
                "https://www.svgrepo.com/show/532889/sun.svg"
            );

        }

    </script>

</body>
</html>
