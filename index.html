<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon"
      type="image/png"
      href="https://cdn-icons-png.flaticon.com/128/6177/6177329.png">

<title>Student Task Board - Login</title>


<style>


    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }


    body {
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        background: #f7f8fc;
        color: #111827;

        transition: 0.3s ease;
    }


    /* =========================
       MAIN LOGIN CONTAINER
    ========================= */

    .login-container {
        width: 100%;
        max-width: 430px;

        background: rgba(255, 255, 255, 0.13);

        padding: 40px;
        backdrop-filter: blur(12px);
        border-radius: 20px;

        border: 1px solid #e5e7eb;

        box-shadow:
            0 20px 50px rgba(30, 41, 59, 0.185);
    }


    /* =========================
       LOGO
    ========================= */

    .logo {
        width: 55px;
        height: 55px;

        margin: 0 auto 20px;

        display: flex;
        justify-content: center;
        align-items: center;

        background: linear-gradient(
            135deg,
            #633de0,
            #5230cd
        );

        color: white;

        border-radius: 15px;

        font-size: 24px;
        font-weight: bold;

        box-shadow:
            0 8px 20px rgba(99, 61, 224, 0.25);
    }

    
        /* Student message */
        .messages{
            position: absolute;
            z-index: 10;
            top: 5px;
            margin: 30px 10px ;
            padding: 30px;
          left: 0px;
          text-align:start;
          font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
        .messages h1{
            font-weight: 600;
        }
        .inside_msg{    
          margin: 5px 0px;
            font-size: 55px;
            font-weight:900;   
            
        }
       .brand-header {
            display: flex;
            align-items: center;    
}

     .backgroundimg{
        width: 100%;
    min-height: 100vh;

    background-image: url("./back_groung_image.png");

    background-position: center;
    background-repeat: no-repeat;
    background-size: cover;
    
    display: flex;
    justify-content: flex-end;
    align-items: center;
    padding: 40px 8px ;
    position: relative;
    }
       

.brand-header .logo {
    margin: 10px;
}
        .violet{
           color: #5230cd;
        }
      .inside_para{
        color:  #39383f;
        font-size: large;

      }


    /* =========================
       INVALID LOGIN
    ========================= */

    .invalid-info {
        color: rgba(255, 0, 0, 0.701);

        margin: 20px 0;

        display: none;
    }

    .invalid-info.show {
        display: block;
    }


    /* =========================
       HEADING
    ========================= */

    .login-header {
        text-align: center;

        margin-bottom: 30px;
    }

    .login-header h1 {
        font-size: 28px;

        margin-bottom: 8px;

        color: #111827;
    }

    .login-header p {
        font-size: 14px;

        color: #64748b;
    }


    /* =========================
       FORM
    ========================= */

    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        display: block;

        margin-bottom: 7px;

        font-size: 14px;

        font-weight: 600;

        color: #374151;
    }


    /* =========================
       INPUT
    ========================= */

    .input-box {
        position: relative;
    }

    .input-box input {
        width: 100%;

        padding: 14px 15px;

        border: 1px solid #d1d5db;

        border-radius: 10px;

        outline: none;

        background: #f9fafb00;

        color: #111827;

        font-size: 14px;

        transition: 0.2s;
    }

    .input-box input:hover {
        border-color: #9ca3af;
    }

    .input-box input:focus {
        background: rgba(255, 255, 255, 0.089);

        border-color: #633de0;

        box-shadow:
            0 0 0 3px rgba(99, 61, 224, 0.12);
    }


    /* =========================
       PASSWORD
    ========================= */

    .password-header {
        display: flex;

        justify-content: space-between;

        align-items: center;

        margin-bottom: 7px;
    }

    .password-header label {
        margin: 0;
    }

    .forgot-password {
        border: none;

        background: none;

        padding: 0;

        color: #633de0;

        font-size: 12px;

        cursor: pointer;

        box-shadow: none;
    }

    .forgot-password:hover {
        transform: none;

        box-shadow: none;

        text-decoration: underline;
    }


    /* =========================
       LOGIN BUTTON
    ========================= */

    .login-btn {
        width: 100%;

        padding: 14px;

        margin-top: 5px;

        border: none;

        border-radius: 10px;

        background:
            linear-gradient(
                135deg,
                #633de0,
                #5230cd
            );

        color: white;

        font-size: 15px;

        font-weight: 600;

        cursor: pointer;

        transition: 0.2s;

        box-shadow:
            0 6px 15px rgba(99, 61, 224, 0.25);
    }

    .login-btn:hover {
        transform: translateY(-2px);

        box-shadow:
            0 10px 20px rgba(99, 61, 224, 0.3);
    }

    .login-btn:active {
        transform: translateY(0);
    }


    /* =========================
       DIVIDER
    ========================= */

    .divider {
        display: flex;

        align-items: center;

        gap: 12px;

        margin: 25px 0;
    }

    .divider span {
        height: 1px;

        flex: 1;

        background: #e5e7eb;
    }

    .divider p {
        font-size: 12px;

        color: #94a3b8;
    }


    /* =========================
       GOOGLE BUTTON
    ========================= */

    .google-btn {
        width: 100%;

        padding: 13px;

        display: flex;

        align-items: center;

        justify-content: center;

        gap: 12px;

        border: 1px solid #d1d5db;

        border-radius: 10px;

        background: white;

        color: #374151;

        font-size: 14px;

        font-weight: 600;

        cursor: pointer;

        transition: 0.2s;

        box-shadow: none;
    }

    .google-btn:hover {
        background: #f9fafb;

        border-color: #9ca3af;

        transform: translateY(-1px);

        box-shadow:
            0 5px 12px rgba(30, 41, 59, 0.08);
    }

    .google-btn img {
        width: 20px;

        height: 20px;

        padding: 0;

        background: none;

        border-radius: 0;

        object-fit: contain;
    }


    /* =========================
       SIGN UP
    ========================= */

    .signup {
        text-align: center;

        margin-top: 25px;

        font-size: 13px;

        color: #141414;
    }

    .signup a {
        color: #4400f1;

        font-weight: 600;

        text-decoration: none;
    }

    .signup a:hover {
        text-decoration: underline;
    }




@media (max-width: 768px) {
    .backgroundimg {
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 25px;
        padding: 30px 20px;
        overflow: visible;
        background-position: center;
    }

    /* Intro text above login card */
    .messages {
        position: relative;
        top: auto;
        left: auto;
        width: 100%;
        max-width: 500px;
        margin: 0;
        padding: 0;
        text-align: center;
    }

    .brand-header {
        justify-content: center;
        align-items: center;
        gap: 8px;
    }

    .brand-header .logo {
        width: 45px;
        height: 45px;
        margin: 0;
        font-size: 20px;
        border-radius: 12px;
        flex-shrink: 0;
    }

    .brand-header h1 {
        font-size: 22px;
    }

    .inside_msg {
        margin: 18px 0 12px;
        font-size: clamp(30px, 6vw, 44px);
        line-height: 1.2;
        font-weight: 800;
    }

    .inside_para {
        font-size: 15px;
        line-height: 1.7;
    }

    .login-container {
        position: relative;
        width: 100%;
        max-width: 450px;
        flex: none;
        padding: 30px 25px;
        border-radius: 18px;
    }

    .login-container > .logo {
        width: 50px;
        height: 50px;
        font-size: 21px;
        margin-bottom: 18px;
    }

    .login-header {
        margin-bottom: 24px;
    }

    .login-header h1 {
        font-size: 25px;
    }

    .login-header p {
        line-height: 1.5;
    }

    /* Better mobile keyboard usability */
    .input-box input {
        font-size: 16px;
    }

    .form-group {
        margin-bottom: 16px;
    }

    .divider {
        margin: 22px 0;
    }

    .signup {
        line-height: 1.7;
    }
}

@media (max-width: 480px) {
    .backgroundimg {
        padding: 24px 14px;
        gap: 22px;
    }

    .messages {
        max-width: 100%;
    }

    .brand-header {
        gap: 7px;
    }

    .brand-header .logo {
        width: 40px;
        height: 40px;
        font-size: 18px;
    }

    .brand-header h1 {
        font-size: 19px;
    }

    .inside_msg {
        margin: 15px 0 10px;
        font-size: clamp(27px, 7vw, 36px);
    }

    .inside_para {
        font-size: 13px;
        line-height: 1.7;
    }

    .login-container {
        padding: 25px 20px;
        border-radius: 16px;
    }

    .login-container > .logo {
        width: 46px;
        height: 46px;
        font-size: 20px;
        margin-bottom: 16px;
    }

    .login-header {
        margin-bottom: 22px;
    }

    .login-header h1 {
        font-size: 23px;
    }

    .login-header p {
        font-size: 13px;
    }

    .invalid-info {
        margin: 15px 0;
        font-size: 13px;
    }

    .form-group label {
        font-size: 13px;
    }

    .input-box input {
        padding: 13px 12px;
    }

    .forgot-password {
        font-size: 11px;
    }

    .login-btn {
        padding: 13px;
    }

    .google-btn {
        padding: 12px;
        gap: 9px;
        font-size: 13px;
    }

    .google-btn img {
        width: 19px;
        height: 19px;
    }

    .divider {
        margin: 20px 0;
    }

    .signup {
        margin-top: 20px;
        font-size: 12px;
    }
}



@media (max-width: 350px) {
    .backgroundimg {
        padding: 20px 10px;
        gap: 18px;
    }

    .brand-header {
        gap: 5px;
    }

    .brand-header .logo {
        width: 35px;
        height: 35px;
        font-size: 16px;
        border-radius: 10px;
    }

    .brand-header h1 {
        font-size: 16px;
    }

    .inside_msg {
        font-size: 26px;
        line-height: 1.25;
    }

    .inside_para {
        font-size: 12px;
    }

    .login-container {
        padding: 22px 15px;
        border-radius: 14px;
    }

    .login-header h1 {
        font-size: 21px;
    }

    .login-header p {
        font-size: 12px;
    }

    .form-group {
        margin-bottom: 14px;
    }

    .input-box input {
        padding: 12px 10px;
        font-size: 16px;
    }

    .forgot-password {
        font-size: 10px;
    }

    .google-btn {
        gap: 6px;
        padding: 11px 6px;
        font-size: 11px;
    }

    .signup {
        font-size: 11px;
    }
}

/* =========================================
   LANDSCAPE PHONES
========================================= */

@media (max-height: 500px) and (orientation: landscape) {
    .backgroundimg {
        min-height: 100vh;
        min-height: 100dvh;
        padding: 20px;
        gap: 20px;
    }

    .messages {
        position: relative;
        top: auto;
        left: auto;
        margin: 0;
        padding: 5px;
    }

    .inside_msg {
        font-size: clamp(25px, 4vw, 38px);
    }

    .inside_para {
        font-size: 12px;
    }

    .login-container {
        padding: 22px;
    }
}
</style>

</head>

<body>


<div class="backgroundimg">
 <div class="messages">
       
   <div class="brand-header">
       <span class="logo" id="logo_message">ST</span>
       <h1>Student task Board</h1>
   </div>
   <div class="inside_msg">
      <div>Organize Today,</div>
      <div>Achieve <span class="violet">Tomorrow</span></div>
   </div>
   <div class="inside_para">
      <p>Keep track of your tasks, manage your time</p>
      <p>and build the productive student you want to be.</p>
   </div>
</div>




<!-- =========================
     LOGIN
========================= -->

<div class="login-container">


    <div class="logo">
        ST
    </div>



    <div class="login-header">

        <h1>
            Welcome Back
        </h1>

        <p>
            Login to continue to your Student Task Board
        </p>

    </div>



    <div class="invalid-info">
        Invalid credentials
    </div>



    <form id="loginForm">


        <!-- EMAIL -->

        <div class="form-group">

            <label for="email">
                Email
            </label>

            <div class="input-box">

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>

        </div>



        <!-- PASSWORD -->

        <div class="form-group">

            <div class="password-header">

                <label for="password">
                    Password
                </label>

                <button
                    type="button"
                    class="forgot-password"
                >
                    Forgot password?
                </button>

            </div>


            <div class="input-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>

        </div>



        <!-- LOGIN -->

        <button
            type="submit"
            class="login-btn"
        >
            Login
        </button>

    </form>



    <!-- =========================
         DIVIDER
    ========================= -->

    <div class="divider">

        <span></span>

        <p>
            OR
        </p>

        <span></span>

    </div>



    <!-- =========================
         GOOGLE
    ========================= -->

    <button
        class="google-btn"
        id="googleBtn"
        type="button"
    >

        <img
            src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
            alt="Google"
        >

        Continue with Google

    </button>



    <!-- =========================
         SIGN UP
    ========================= -->

    <div class="signup">

        Don't have an account?

        <a href="signup.html">
            Sign up
        </a>

    </div>


</div>



<script>


    /* =========================
       ELEMENTS
    ========================= */

    let loginForm =
        document.querySelector("#loginForm");

    let googleBtn =
        document.querySelector("#googleBtn");

    let themeBtn =
        document.querySelector("#themeBtn");

    let themeIcon =
        document.querySelector("#themeIcon");

    let email =
        document.querySelector("#email");

    let password =
        document.querySelector("#password");

    let invalid_login =
        document.querySelector(".invalid-info");



    /* =========================
       NORMAL LOGIN
    ========================= */

    loginForm.addEventListener(
        "submit",
        async function(e) {

            e.preventDefault();


            /* =========================
               BASIC VALIDATION
            ========================= */

            if (
                email.value.trim() === "" ||
                password.value.trim() === ""
            ) {

                alert("Please fill all fields");

                return;

            }


            /* =========================
               GET SAVED USER
            ========================= */

            let last_logged_email =
                localStorage.getItem("email");

            let last_logged_password =
                localStorage.getItem("password");



            /* =========================
               CHECK LOGIN
            ========================= */

            if (
                last_logged_email !== email.value.trim() ||
                last_logged_password !== password.value
            ) {

                invalid_login.classList.add("show");

                return;

            }


            /* =========================
               LOGIN SUCCESS
            ========================= */

            invalid_login.classList.remove("show");


            localStorage.setItem(
                "loggedIn",
                "true"
            );


            /* =========================
               RESEND LOGIN EMAIL
            ========================= */

            let loginEmail =
                localStorage.getItem("email");

            let userName =
                localStorage.getItem("user_name");
            let userPhone = localStorage.getItem("phone");

            try {

                let response =
                    await fetch(
                        "/api/send-login-email",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                email: loginEmail,

                                name: userName

                            })

                        }
                    );


                let result =
                    await response.json();


                if (!response.ok) {

                    console.error(
                        "Login email failed:",
                        result
                    );

                } else {

                    console.log(
                        "Login email sent successfully:",
                        result
                    );

                }


            } catch (error) {

                console.error(
                    "Error sending login email:",
                    error
                );

            }
            /* =========================
   SEND LOGIN WHATSAPP
========================= */

try {

    let whatsappResponse = await fetch(
        "/api/send-login-whatsapp",
        {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                phone: userPhone,

                name: userName

            })
        }
    );

    let whatsappResult =
        await whatsappResponse.json();

    if (!whatsappResponse.ok) {

        console.error(
            "WhatsApp failed:",
            whatsappResult
        );

    } else {

        console.log(
            "WhatsApp sent successfully:",
            whatsappResult
        );

    }

} catch (error) {

    console.error(
        "WhatsApp error:",
        error
    );

}

            /* =========================
               GO TO MAIN PAGE
            ========================= */
         let logged_details = localStorage.getItem("loggedIn");
         if (logged_details === "true") {
            
            window.location.href =
                "main.html";

         }
         else{
            window.location.href = "index.html"
         }

        }
    );



    /* =========================
       GOOGLE LOGIN
    ========================= */

    googleBtn.addEventListener(
        "click",
        function() {

            alert(
                "Google Login will be connected using Google OAuth."
            );

        }
    );



    /* =========================
       DARK MODE
    ========================= */

    themeBtn.addEventListener(
        "click",
        function() {

            document.body.classList.toggle(
                "dark-mode"
            );


            if (
                document.body.classList.contains(
                    "dark-mode"
                )
            ) {

                localStorage.setItem(
                    "loginDark",
                    "true"
                );


                themeIcon.setAttribute(
                    "src",
                    "https://www.svgrepo.com/show/532889/sun.svg"
                );


            } else {

                localStorage.setItem(
                    "loginDark",
                    "false"
                );


                themeIcon.setAttribute(
                    "src",
                    "https://www.svgrepo.com/show/532875/moon.svg"
                );

            }

        }
    );



    /* =========================
       LOAD DARK MODE
    ========================= */

    let savedTheme =
        localStorage.getItem("loginDark");


    if (savedTheme === "true") {

        document.body.classList.add(
            "dark-mode"
        );


        themeIcon.setAttribute(
            "src",
            "https://www.svgrepo.com/show/532889/sun.svg"
        );

    }


</script>


</body>

</html>
