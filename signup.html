
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png"
        href="https://cdn-icons-png.flaticon.com/128/6177/6177329.png">

    <title>Student Task Board - Sign Up</title>

    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        /* =========================
           BODY
        ========================= */

        body {
           min-height: 100vh;
            margin: 0;
            padding: 0;
            background: #f7f8fc;
            color: #111827;
        }
.backgroundimg{
        width: 100%;
    min-height: 100vh;

    background-image: url("./back_groung_image.png");

    background-position: center;
    background-repeat: no-repeat;
    background-size: cover;
    
    display: flex;
    justify-content: flex-end;
    align-items: center;
    padding: 40px 8px ;
    position: relative;
    }
       


        /* =========================
           LOGO
        ========================= */

        .logo {
            width: 55px;
            height: 55px;

            margin: 0 auto 20px;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #633de0,
                    #5230cd
                );

            color: white;

            border-radius: 15px;

            font-size: 24px;
            font-weight: bold;

            box-shadow:
                0 8px 20px rgba(99, 61, 224, 0.25);
        }


        /* =========================
           HEADER
        ========================= */

        .signup-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .signup-header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #111827; 
        }

        .signup-header p {
            font-size: 14px;
            color: #64748b;
        }

        /* =========================
           SIGNUP CONTAINER
        ========================= */

        .signup-container {
            width: 100%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.171);
            backdrop-filter: blur(12px);
            right: 60px;
            top: 10px;
            padding: 40px;
            border-radius: 20px;

            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 50px rgba(30, 41, 59, 0.2);

            position: relative;
            z-index: 1;
        }


        /* Student message */
        .messages{
            position: absolute;
            z-index: 10;
            top: 10px;
            margin: 30px 10px ;
            padding: 40px;
          left: 0px;
          text-align:start;
          font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
        .messages h1{
            font-weight: 600;
        }
        .inside_msg{
          margin: 25px 0px;
            font-size: 55px;
            font-weight:900;   
            
        }
       .brand-header {
            display: flex;
            align-items: center;
            
}
.brand-header .logo {
    margin: 10px;
}
        .violet{
           color: #5230cd;
        }
      .inside_para{
        color: #343b46;
        font-size: large;

      }

    body.dark-mode .img_aside{
        opacity: 0.6;
    }
        /* =========================
           FORM
        ========================= */

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            font-size: 14px;

            font-weight: 600;

            color: #374151;
        }


        /* =========================
           INPUT
        ========================= */

        .input-box {
            position: relative;
        }

        .input-box input {
            width: 100%;

            padding: 14px 15px;

            border: 1px solid #d1d5db;

            border-radius: 10px;

            outline: none;

            background: #f9fafb1e;

            color: #111827;

            font-size: 14px;

            transition: 0.2s;
        }

        .input-box input:hover {
            border-color: #9ca3af;
        }

        .input-box input:focus {
            background: white;

            border-color: #633de0;

            box-shadow:
                0 0 0 3px rgba(99, 61, 224, 0.12);
        }


        /* =========================
           PASSWORD
        ========================= */

        .password-wrapper {
            position: relative;
            
        }

        .password-wrapper input {
            padding-right: 55px;
             width: 100%;

            padding: 14px 15px;

            border: 1px solid #d1d5db;

            border-radius: 10px;

            outline: none;

            background: #f9fafb1e;

            color: #111827;

            font-size: 14px;

            transition: 0.2s;
        }

        .show-password {
            position: absolute;

            right: 10px;
            top: 50%;

            transform: translateY(-50%);

            padding: 5px;

            background: none;

            border: none;

            box-shadow: none;

            color: #5634c5;

            font-size: 12px;

            cursor: pointer;
        }

        .show-password:hover {
            transform: translateY(-50%);
            box-shadow: none;
        }


        /* =========================
           SIGNUP BUTTON
        ========================= */

        .signup-btn {
            width: 100%;

            padding: 14px;

            margin-top: 5px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #633de0,
                    #5230cd
                );

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;

            box-shadow:
                0 6px 15px rgba(99, 61, 224, 0.25);
        }

        .signup-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 10px 20px rgba(99, 61, 224, 0.3);
        }

        .signup-btn:active {
            transform: translateY(0);
        }

        .signup-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }


        /* =========================
           DIVIDER
        ========================= */

        .divider {
            display: flex;

            align-items: center;

            gap: 12px;

            margin: 25px 0;
        }

        .divider span {
            height: 1px;

            flex: 1;

            background: #e5e7eb;
        }

        .divider p {
            font-size: 12px;

            color: #94a3b8;
        }


        /* =========================
           GOOGLE BUTTON
        ========================= */

        .google-btn {
            width: 100%;

            padding: 13px;

            display: flex;

            justify-content: center;
            align-items: center;

            gap: 12px;

            border: 1px solid #d1d5db;

            border-radius: 10px;

            background: white;

            color: #374151;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;

            box-shadow: none;
        }

        .google-btn img {
            width: 20px;
            height: 20px;

            padding: 0;

            background: none;

            border-radius: 0;
        }

        .google-btn:hover {
            background: #f9fafb;

            border-color: #9ca3af;

            transform: translateY(-1px);

            box-shadow:
                0 5px 12px rgba(30, 41, 59, 0.08);
        }


        /* =========================
           LOGIN LINK
        ========================= */

        .login-link {
            text-align: center;

            margin-top: 25px;

            font-size: 13px;

            color: #64748b;
        }

        .login-link a {
            color: #633de0;

            font-weight: 600;

            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

@media (max-width: 768px) {
    .backgroundimg {
        min-height: 100vh;
        height: auto;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 25px;
        padding: 30px 18px;
        background-position: center;
        background-size: cover;
    }

    /* Put the introductory text above the form */
    .messages {
        position: relative;
        top: auto;
        left: auto;
        transform: none;
        width: 100%;
        max-width: 500px;
        margin: 0;
        padding: 0;
        text-align: center;
    }

    .brand-header {
        justify-content: center;
        gap: 8px;
    }

    .brand-header .logo {
        margin: 0;
        flex-shrink: 0;
    }

    .brand-header h1 {
        font-size: 22px;
    }

    .inside_msg {
        margin: 20px 0 12px;
        font-size: clamp(30px, 6vw, 44px);
        font-weight: 800;
        line-height: 1.2;
    }

    .inside_para {
        font-size: 15px;
        line-height: 1.6;
    }

    .signup-container {
        position: relative;
        top: auto;
        right: auto;
        width: 100%;
        max-width: 450px;
        padding: 30px 25px;
        border-radius: 18px;
    }

    .signup-header {
        margin-bottom: 24px;
    }

    .signup-header h1 {
        font-size: 25px;
    }

    .form-group {
        margin-bottom: 16px;
    }

    .input-box input,
    .password-wrapper input {
        font-size: 16px;
    }
}

/* Mobile phones */
@media (max-width: 480px) {
    .backgroundimg {
        padding: 24px 14px;
        gap: 22px;
    }

    .messages {
        max-width: 100%;
    }

    .brand-header .logo {
        width: 43px;
        height: 43px;
        font-size: 19px;
        border-radius: 12px;
    }

    .brand-header h1 {
        font-size: 19px;
    }

    .inside_msg {
        margin: 16px 0 10px;
        font-size: clamp(27px, 7vw, 36px);
    }

    .inside_para {
        font-size: 14px;
    }

    .signup-container {
        padding: 25px 20px;
        border-radius: 16px;
    }

    .signup-container > .logo {
        width: 46px;
        height: 46px;
        font-size: 21px;
        margin-bottom: 16px;
    }

    .signup-header h1 {
        font-size: 23px;
    }

    .signup-header p {
        font-size: 13px;
        line-height: 1.5;
    }

    .form-group label {
        font-size: 13px;
    }

    .input-box input,
    .password-wrapper input {
        padding: 13px 12px;
        font-size: 16px;
    }

    .password-wrapper input {
        padding-right: 55px;
    }

    .show-password {
        right: 8px;
    }

    .signup-btn,
    .google-btn {
        padding: 13px;
    }

    .divider {
        margin: 20px 0;
    }

    .login-link {
        margin-top: 20px;
        line-height: 1.7;
    }
}

/* Small mobile phones */
@media (max-width: 350px) {
    .backgroundimg {
        padding: 20px 10px;
        gap: 18px;
    }

    .brand-header {
        gap: 6px;
    }

    .brand-header h1 {
        font-size: 16px;
    }

    .brand-header .logo {
        width: 38px;
        height: 38px;
        font-size: 17px;
    }

    .inside_msg {
        font-size: 27px;
    }

    .inside_para {
        font-size: 13px;
    }

    .signup-container {
        padding: 22px 15px;
    }

    .signup-header h1 {
        font-size: 21px;
    }

    .signup-header p {
        font-size: 12px;
    }

    .input-box input,
    .password-wrapper input {
        padding: 12px 10px;
        font-size: 16px;
    }

    .password-wrapper input {
        padding-right: 50px;
    }

    .show-password {
        font-size: 11px;
    }

    .google-btn {
        gap: 8px;
        font-size: 12px;
    }
}

/* Very short screens in landscape mode */
@media (max-height: 500px) and (orientation: landscape) {
    .backgroundimg {
        min-height: 100vh;
        height: auto;
        padding-top: 20px;
        padding-bottom: 20px;
    }

    .signup-container {
        margin: 0 auto;
    }
}


     
        

    </style>
</head>


<body>

<div class="backgroundimg">
 <div class="messages">
       
   <div class="brand-header">
       <span class="logo" id="logo_message">ST</span>
       <h1>Student task Board</h1>

   </div>
   <div class="inside_msg">
      <div>Sign Up Today  ,</div>
      <div>Achieve <span class="violet">Forever</span></div>
   </div>
   <div class="inside_para">
      <p>Keep track of your tasks,</p>
      <p>Build the productive student you want to be.</p>
   </div>
</div>

 


    <!-- =========================
         SIGN UP
    ========================= -->

    <div class="signup-container">


        <!-- LOGO -->

        <div class="logo">
            ST
        </div>


        <!-- HEADER -->

        <div class="signup-header">

            <h1>Create Account</h1>

            <p>
                Create your account to start managing tasks
            </p>

        </div>


        <!-- =========================
             FORM
        ========================= -->

        <form id="signupForm">


            <!-- NAME -->

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <div class="input-box">

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >

                </div>

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <div class="input-box">

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>

            </div>

                  <div class="form-group">

                <label for="PHONE">
                    Phone number 
                </label>

                <div class="input-box">

                    <input
                        type="tel"
                        id="PHONE"
                        placeholder="Enter your phone number for verfication"
                        autocomplete="phone"
                        required
                    >

                </div>

            </div>



            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        id="showPassword"
                    >
                        Show
                    </button>

                </div>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        id="showConfirmPassword"
                    >
                        Show
                    </button>

                </div>

            </div>


            <!-- SIGNUP BUTTON -->

            <button
                type="submit"
                class="signup-btn"
                id="signupBtn"
            >
                Create Account
            </button>

        </form>


        <!-- DIVIDER -->

        <div class="divider">

            <span></span>

            <p>OR</p>

            <span></span>

        </div>


        <!-- GOOGLE -->

        <button
            type="button"
            class="google-btn"
            id="googleBtn"
        >

            <img
                src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                alt="Google"
            >

            Continue with Google

        </button>


        <!-- LOGIN -->

        <div class="login-link">

            Already have an account?

            <a href="index.html">
                Login
            </a>

        </div>


    </div>

   </div>

    <script>


        /* =========================
           ELEMENTS
        ========================= */

        const signupForm =
            document.querySelector("#signupForm");

        const signupBtn =
            document.querySelector("#signupBtn");

        const googleBtn =
            document.querySelector("#googleBtn");


        const nameInput =
            document.querySelector("#name");

        const emailInput =
            document.querySelector("#email");

        const password =
            document.querySelector("#password");

        const confirmPassword =
            document.querySelector("#confirmPassword");

        const showPassword =
            document.querySelector("#showPassword");

        const showConfirmPassword =
            document.querySelector("#showConfirmPassword");

        const phone = document.querySelector("#PHONE")

        /* =========================
           SIGN UP
        ========================= */

        signupForm.addEventListener(
            "submit",
            async function (e) {

                e.preventDefault();


                const name =
                    nameInput.value.trim();

                const email =
                    emailInput.value.trim();
                const Phone = phone.value.trim()    


                /* =========================
                   CHECK PASSWORDS
                ========================= */

                if (
                    password.value !==
                    confirmPassword.value
                ) {

                    alert("Passwords do not match!");

                    return;
                }


                /* =========================
                   DISABLE BUTTON
                ========================= */

                signupBtn.disabled = true;

                signupBtn.textContent =
                    "Creating Account...";


                try {


                    /* =========================
                       SAVE USER INFORMATION
                    ========================= */

                    localStorage.removeItem("password");
                    localStorage.removeItem("email");
                    localStorage.removeItem("user_name");
                    localStorage.removeItem("phone")


                    localStorage.setItem(
                        "email",
                        email
                    );

                    localStorage.setItem(
                        "user_name",
                        name
                    );

                    localStorage.setItem(
                        "password",
                        password.value
                    );

                    localStorage.setItem(
                        "phone",
                        Phone
                    )


                    /* =========================
                       SEND WELCOME EMAIL
                    ========================= */

                    const response = await fetch(
                        "/api/send-welcome-email",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                name: name,

                                email: email

                            })
                        }
                    );


                    const data =
                        await response.json();


                    /* =========================
                       EMAIL ERROR
                    ========================= */

                    if (!response.ok) {

                        console.error(
                            "Email error:",
                            data
                        );

                    

                        alert(
                            "Account created successfully, !!"
                        );

                    }

                    else {

                        console.log(
                            "Welcome email sent:",
                            data
                        );

                        alert(
                            "Account created successfully! Welcome email sent."
                        );

                    }


                    /* =========================
                       GO TO LOGIN
                    ========================= */

                    window.location.href =
                        "index.html";


                }

                catch (error) {

                    console.error(
                        "Signup error:",
                        error
                    );

                    alert(
                        "Account created, but the email service is currently unavailable."
                    );


                    window.location.href =
                        "index.html";

                }

            }
        );

        showPassword.addEventListener(
            "click",
            function () {

                if (
                    password.type === "password"
                ) {

                    password.type = "text";

                    showPassword.textContent =
                        "Hide";

                }

                else {

                    password.type = "password";

                    showPassword.textContent =
                        "Show";

                }

            }
        );


        /* =========================
           SHOW CONFIRM PASSWORD
        ========================= */

        showConfirmPassword.addEventListener(
            "click",
            function () {

                if (
                    confirmPassword.type === "password"
                ) {

                    confirmPassword.type = "text";

                    showConfirmPassword.textContent =
                        "Hide";

                }

                else {

                    confirmPassword.type = "password";

                    showConfirmPassword.textContent =
                        "Show";

                }

            }
        );


        /* =========================
           GOOGLE SIGNUP
        ========================= */

        googleBtn.addEventListener(
            "click",
            function () {

                /*
                    Real Google authentication
                    should be connected using
                    Google OAuth or Firebase.
                */

                alert(
                    "Google Signup will be connected using Google OAuth."
                );

            }
        );


       

    </script>

</body>

</html>
